[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rofi-agent-plus"
version = "0.15.0a9"
description = "Direct native agent manager and TUI window picker"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.3"]

[project.scripts]
rofi-agent-plus = "rofi_agent_plus.app:main"
rofi-agent-plus-rofi = "rofi_agent_plus.launcher:main"
rofi-agent-plus-host = "rofi_agent_plus.host:main"
rofi-agent-plus-viewer = "rofi_agent_plus.viewer:main"

[tool.setuptools.packages.find]
include = ["rofi_agent_plus*"]

[tool.setuptools.package-data]
rofi_agent_plus = ["assets/providers/*.svg"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
