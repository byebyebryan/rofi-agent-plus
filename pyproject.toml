[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rofi-agent-plus"
version = "0.15.0a16"
description = "Rofi launcher for local and remote Codex and Claude TUIs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []
keywords = ["rofi", "codex", "claude", "niri", "kitty", "ssh", "tui"]

[project.urls]
Source = "https://github.com/byebyebryan/rofi-agent-plus"
Documentation = "https://github.com/byebyebryan/rofi-agent-plus/blob/main/docs/README.md"
Issues = "https://github.com/byebyebryan/rofi-agent-plus/issues"

[project.optional-dependencies]
dev = ["ruff==0.16.3"]

[project.scripts]
rofi-agent-plus = "rofi_agent_plus.app:main"
rofi-agent-plus-rofi = "rofi_agent_plus.launcher:main"
rofi-agent-plus-host = "rofi_agent_plus.host:main"
rofi-agent-plus-viewer = "rofi_agent_plus.viewer:main"

[tool.setuptools.packages.find]
include = ["rofi_agent_plus*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
